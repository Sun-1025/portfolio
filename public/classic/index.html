<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>经典版已归档 · 孙志昊</title>
<style>
  :root { color-scheme: dark; --bg: #0a0c0f; --surface: #12171c; --ink: #edf2f6; --ink-2: #c2ccd6; --muted: #93a0ac; --line: rgba(226, 234, 242, .16); --accent: #b4ccde; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 28px; background: radial-gradient(circle at 50% 35%, #151c22, var(--bg) 62%); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; line-height: 1.7; }
  main { width: min(560px, 100%); padding: 34px; border: 1px solid var(--line); border-radius: 18px; background: rgba(22, 26, 30, .72); box-shadow: 0 24px 70px rgba(0, 0, 0, .32); }
  .kicker { margin: 0 0 16px; color: var(--muted); font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11px; letter-spacing: .14em; }
  h1 { margin: 0 0 14px; font-size: clamp(30px, 8vw, 40px); line-height: 1.2; letter-spacing: -.03em; }
  p { margin: 0 0 14px; color: var(--ink-2); font-size: 16px; }
  .note { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  a { display: inline-flex; align-items: center; gap: 9px; min-height: 46px; margin-top: 12px; padding: 0 18px; border: 1px solid var(--accent); border-radius: 10px; background: var(--accent); color: #0a0c0f; font-size: 15px; font-weight: 600; text-decoration: none; }
  a:hover { filter: brightness(1.06); }
  footer { margin-top: 20px; color: var(--muted); font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11px; letter-spacing: .08em; text-align: center; }
</style>
</head>
<body>
<main>
  <p class="kicker">ARCHIVE / CLASSIC</p>
  <h1>经典版已归档</h1>
  <p>旧版页面不再单独维护，也不再展示未经确认的个人信息与旧数据。</p>
  <p>新版把导航收成实习、经历、兴趣三块，项目放进经历，工具箱单独入口。内容和照片都按当前事实重新整理过。</p>
  <a href="/">回到新版 <span aria-hidden="true">→</span></a>
  <p class="note">如果你是从旧链接过来的，直接回首页即可。新的项目记录、公益实践和兴趣相册都在那里。</p>
  <footer>孙志昊 · 物联网工程 / 嵌入式 · 2026</footer>
</main>
</body>
</html>
