<style>
/* ==================== 设计令牌 ==================== */
:root{
  /* 色板：深色单一基调，唯一强调色 */
  --bg:#131209;
  --surface:#1f1f1f;
  --surface-2:#272727;
  --surface-3:#313131;
  --ink:#ece7db;
  --ink-2:#a9b3a6;
  --ink-3:#78867b;
  --accent:#cdd96b;
  --line:rgba(236,231,219,.14);
  --line-2:rgba(236,231,219,.08);

  /* 间距（4 / 8 / 12 / 16 / 24 / 32 / 40 / 48 / 64 / 80 / 96） */
  --s-50:4px; --s-75:8px; --s-100:12px; --s-200:16px;
  --s-300:24px; --s-400:32px; --s-500:40px; --s-600:48px;
  --s-700:64px; --s-800:80px; --s-900:96px;

  /* 圆角：8 / 12 / 16 / full */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:999px;

  /* 动效 */
  --ease:cubic-bezier(.22,1,.36,1);
  --dur-move:500ms;
  --dur-color:300ms;

  /* 字体 */
  --font:"Manrope","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
/* ==================== 浅色主题（增量，默认仍为深色） ==================== */
html[data-theme="light"]{
  --bg:#f4f2e8;
  --surface:#ffffff;
  --surface-2:#f7f5ee;
  --surface-3:#e6e2d6;
  --ink:#1d1c15;
  --ink-2:#4e4c41;
  --ink-3:#7d7a6c;
  --accent:#6b7a12;
  --line:rgba(29,28,21,.16);
  --line-2:rgba(29,28,21,.09);
}
html[data-theme="light"] body{background:var(--bg);color:var(--ink)}
html[data-theme="light"] ::selection{background:var(--accent);color:#fff}
html[data-theme="light"] .scene img{filter:brightness(1.05) saturate(.94)}
html[data-theme="light"] .veil{
  background:
    radial-gradient(ellipse 135% 105% at 50% 42%, rgba(244,242,232,0) 46%, rgba(244,242,232,.62) 100%),
    linear-gradient(180deg, rgba(244,242,232,.5) 0%, rgba(244,242,232,0) 26%, rgba(244,242,232,0) 58%, rgba(244,242,232,.7) 100%);
}
html[data-theme="light"] .grain{opacity:.1}
html[data-theme="light"] .nav{
  border-color:rgba(29,28,21,.16);
  background:linear-gradient(150deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.66) 48%,rgba(255,255,255,.82) 100%);
  box-shadow:0 10px 30px rgba(0,0,0,.10),inset 0 1.5px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(29,28,21,.06);
}
html[data-theme="light"] .nav-brand{background:linear-gradient(90deg,#1d1c15,#5c5a4e);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme="light"] .node{
  background:linear-gradient(150deg,rgba(255,255,255,.86) 0%,rgba(255,255,255,.64) 48%,rgba(255,255,255,.78) 100%);
  border-color:rgba(29,28,21,.16);
  box-shadow:0 10px 30px rgba(0,0,0,.10),inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(29,28,21,.05);
}
html[data-theme="light"] .node:hover{background:linear-gradient(150deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.78) 50%,rgba(255,255,255,.9) 100%);border-color:rgba(29,28,21,.28)}
html[data-theme="light"] .node-title{color:#1d1c15}
html[data-theme="light"] .node-en{color:rgba(29,28,21,.66)}
html[data-theme="light"] .node-idx{color:rgba(107,122,18,.9)}
html[data-theme="light"] .foot{color:var(--ink-2);text-shadow:none}
html[data-theme="light"] .panel{background:rgba(244,242,232,.62)}
html[data-theme="light"] .panel-inner{color:var(--ink)}
html[data-theme="light"] .panel-close,
html[data-theme="light"] .talk-close{background:rgba(29,28,21,.06);border-color:rgba(29,28,21,.18);color:var(--ink)}
html[data-theme="light"] .talk{background:rgba(255,255,255,.82);box-shadow:0 24px 60px rgba(0,0,0,.16),inset 0 1.5px 0 rgba(255,255,255,.95)}
html[data-theme="light"] .talk-kicker{color:#7d7a6c}
html[data-theme="light"] .talk-title{color:#1d1c15}
html[data-theme="light"] .talk-fab{
  background:rgba(255,255,255,.78);
  border-color:rgba(29,28,21,.18);
  color:#1d1c15;
  box-shadow:0 12px 30px rgba(0,0,0,.14),inset 0 1.5px 0 rgba(255,255,255,.95);
}
html[data-theme="light"] .readbar{background:linear-gradient(180deg,rgba(29,28,21,.12),rgba(29,28,21,.05));border-color:rgba(29,28,21,.14)}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font);
  font-size:16px;line-height:24px;font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--accent);color:var(--bg)}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:var(--r-sm)}

button{font-family:inherit;color:inherit}

/* ==================== 文本样式 ==================== */
.heading-3{font-size:36px;line-height:40px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.title-1{font-size:20px;line-height:28px;font-weight:500}
.title-2{font-size:18px;line-height:28px;font-weight:500}
.title-3{font-size:16px;line-height:24px;font-weight:500}
.body-3{font-size:16px;line-height:24px;font-weight:400;text-wrap:pretty}
.body-4{font-size:14px;line-height:20px;font-weight:600}
.body-6{font-size:14px;line-height:20px;font-weight:400;text-wrap:pretty}
.caption-1{font-size:14px;line-height:20px;font-weight:500}
.caption-4{font-size:12px;line-height:16px;font-weight:500}
.caption-5{font-size:12px;line-height:16px;font-weight:400}

/* ==================== 跳转链接 ==================== */
.skip{
  position:fixed;top:-100px;left:var(--s-200);z-index:200;
  padding:8px 16px;border-radius:var(--r-sm);
  background:var(--accent);color:var(--bg);
  font-size:14px;line-height:20px;font-weight:600;
  transition:top var(--dur-color) var(--ease);
}
.skip:focus{top:var(--s-200)}

/* ==================== 悬浮导航 ==================== */
.nav{
  position:fixed;top:var(--s-300);left:50%;transform:translateX(-50%);
  z-index:60;
  display:flex;align-items:center;gap:var(--s-100);
  padding:8px 18px;
  border-radius:var(--r-full);
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(150deg,rgba(255,255,255,.095) 0%,rgba(255,255,255,.028) 48%,rgba(255,255,255,.055) 100%);
  backdrop-filter:blur(34px) saturate(170%) brightness(1.03);
  -webkit-backdrop-filter:blur(34px) saturate(170%) brightness(1.03);
  box-shadow:0 10px 30px rgba(0,0,0,.26),inset 0 1.5px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.09),inset 1px 0 0 rgba(255,255,255,.07),inset -1px 0 0 rgba(255,255,255,.07);
}
.nav-brand{
  font-size:18px;line-height:28px;font-weight:700;letter-spacing:.01em;
  background:linear-gradient(90deg,#ffffff,#9b9b9b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.nav-sep{width:1px;height:16px;background:var(--line)}
.nav-meta{
  font-size:12px;line-height:16px;font-weight:500;letter-spacing:.2em;
  color:var(--ink-3);text-transform:uppercase;font-variant-numeric:tabular-nums;
}
.theme-toggle{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;flex:0 0 auto;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.07);
  color:var(--ink-2);
  cursor:pointer;
  transition:background var(--dur-color) var(--ease),border-color var(--dur-color) var(--ease),color var(--dur-color) var(--ease),transform var(--dur-move) var(--ease);
}
.theme-toggle:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.34);color:var(--ink)}
.theme-toggle:active{transform:scale(.94)}
.theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.theme-toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .ic-sun{display:none}
html[data-theme="light"] .theme-toggle .ic-moon{display:none}
html[data-theme="light"] .theme-toggle .ic-sun{display:block}

/* ==================== 场景层 ==================== */
.scene{
  position:fixed;inset:0;z-index:0;
  will-change:transform;transform:translate3d(0,0,0) scale(1.05);
}
.scene img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 46%;
  opacity:0;
  backface-visibility:hidden;
}
.scene img.is-on{opacity:1}

/* 图像遮罩：压暗四周，保证文字可读。不属于背景渐变 */
.veil{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 135% 105% at 50% 42%, rgba(0,0,0,0) 42%, rgba(4,10,7,.5) 100%),
    linear-gradient(180deg, rgba(6,12,8,.34) 0%, rgba(6,12,8,0) 26%, rgba(6,12,8,0) 58%, rgba(6,12,8,.62) 100%);
}
.grain{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.32;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='0.35'/></svg>");
  mix-blend-mode:overlay;
}

/* ==================== 分支舞台 ==================== */
.stage{position:relative;width:100%;height:100dvh;overflow:hidden;z-index:5}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity 1100ms var(--ease)}
.lines.is-away{opacity:0}
.lines path{
  fill:none;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke var(--dur-color) var(--ease),stroke-width var(--dur-color) var(--ease),opacity var(--dur-color) var(--ease);
}
/* 液态玻璃长条：外晕 + 玻璃管体 + 高光边，选中时整条“通电”忽闪 */
.lines .l-glow{stroke:rgba(236,231,219,.07);stroke-width:11;filter:blur(4px)}
.lines .l-core{stroke:rgba(236,231,219,.18);stroke-width:4.5;filter:blur(.6px)}
.lines .l-hi{stroke:rgba(255,255,255,.5);stroke-width:1.2;filter:drop-shadow(0 0 4px rgba(255,255,255,.3))}
.lines .l-join{stroke:rgba(239,245,178,.92);stroke-width:2.6;opacity:0;stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(205,217,107,.55))}
.lines path.is-hot.l-glow{stroke:rgba(205,217,107,.18);stroke-width:15}
.lines path.is-hot.l-core{stroke:rgba(205,217,107,.5);stroke-width:6;animation:lblink 1.5s ease-in-out infinite}
.lines path.is-hot.l-hi{stroke:rgba(239,245,178,.9);animation:lblink 1.5s ease-in-out infinite}
.lines path.l-join.is-live{
  opacity:1;
  animation:ljoin .8s ease-out forwards,lblink 2.2s ease-in-out infinite;
}
@keyframes lblink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes ljoin{from{stroke-dashoffset:var(--len,0)}to{stroke-dashoffset:0}}

/* 分支：圆点 + 编号 + 标签 */
.node{
  position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));
  display:flex;align-items:center;gap:var(--s-100);
  padding:var(--s-100) var(--s-200);
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  background:linear-gradient(150deg,rgba(255,255,255,.095) 0%,rgba(255,255,255,.028) 48%,rgba(255,255,255,.055) 100%);
  backdrop-filter:blur(34px) saturate(170%) brightness(1.03);
  -webkit-backdrop-filter:blur(34px) saturate(170%) brightness(1.03);
  box-shadow:0 10px 30px rgba(0,0,0,.26),inset 0 1.5px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.09),inset 1px 0 0 rgba(255,255,255,.07),inset -1px 0 0 rgba(255,255,255,.07);
  cursor:pointer;
  transition:transform var(--dur-move) var(--ease),background var(--dur-color) var(--ease),border-color var(--dur-color) var(--ease),box-shadow var(--dur-color) var(--ease);
}
.node:hover{background:linear-gradient(150deg,rgba(255,255,255,.15) 0%,rgba(255,255,255,.06) 50%,rgba(255,255,255,.10) 100%);border-color:rgba(255,255,255,.34)}
.node:active{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(.98)}
/* 开场：六个分支从人物位置向外释放 */
.node{opacity:1;transition:opacity 720ms var(--ease),transform 900ms cubic-bezier(.16,1,.3,1),background var(--dur-color) var(--ease),border-color var(--dur-color) var(--ease),box-shadow var(--dur-color) var(--ease)}
.node.is-away{opacity:0;transform:translate(-50%,-50%) translate(var(--dx,0px),var(--dy,0px)) rotate(var(--rot,0deg)) scale(.8)}
.node:focus-visible{
  outline:2px solid var(--accent);outline-offset:6px;
}
.node.flip{flex-direction:row-reverse}
.node.flip .node-text{align-items:flex-end;text-align:right}

.node-dot{
  flex:0 0 auto;width:8px;height:8px;border-radius:var(--r-full);
  background:rgba(236,231,219,.6);
  box-shadow:0 0 0 4px rgba(236,231,219,.07);
  transition:transform var(--dur-color) var(--ease),
             background var(--dur-color) var(--ease),
             box-shadow var(--dur-color) var(--ease);
}
.node-text{display:flex;flex-direction:column;gap:var(--s-50)}
.node-top{display:flex;align-items:baseline;gap:var(--s-75)}
.node.flip .node-top{flex-direction:row-reverse}
.node-idx{
  font-size:12px;line-height:16px;font-weight:500;letter-spacing:.08em;
  color:rgba(205,217,107,.8);font-variant-numeric:tabular-nums;
}
.node-title{font-size:20px;line-height:30px;font-weight:700;letter-spacing:.08em;color:#fff;font-family:"SimSun","宋体","Songti SC",serif;transition:color var(--dur-color) var(--ease)}
.node-en{font-size:12px;line-height:16px;font-weight:400;letter-spacing:.24em;color:rgba(255,255,255,.7);transition:color var(--dur-color) var(--ease)}

.node:hover .node-dot,
.node:focus-visible .node-dot,
.node.is-active .node-dot{
  background:var(--accent);transform:scale(1.25);
  box-shadow:0 0 0 5px rgba(205,217,107,.14),0 0 20px rgba(205,217,107,.5);
}
.node:hover .node-title,
.node.is-active .node-title{color:#fff}
.node:hover .node-en{color:rgba(255,255,255,.92)}

/* 可选：分支图片底板 */
.node.has-img{
  display:block;padding:0;overflow:hidden;
  border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);
}
.node.has-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.node.has-img .node-shade{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,18,13,.06) 0%,rgba(10,18,13,.3) 42%,rgba(8,14,10,.9) 100%);
}
.node.has-img .node-label{position:absolute;left:0;right:0;bottom:0;padding:var(--s-100)}
.node.has-img .node-label b{display:block;font-size:14px;line-height:20px;font-weight:600;letter-spacing:.06em}
.node.has-img .node-label span{display:block;font-size:12px;line-height:16px;letter-spacing:.18em;color:var(--ink-3);margin-top:var(--s-50)}
.node.has-img:hover{transform:translate(-50%,-50%) scale(1.03)}

/* ==================== 页脚 ==================== */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  display:flex;justify-content:flex-end;align-items:center;
  gap:var(--s-200);
  padding:var(--s-200) clamp(16px,4vw,44px);
  font-size:12px;line-height:16px;font-weight:500;letter-spacing:.12em;
  color:var(--ink-2);text-shadow:0 1px 8px rgba(0,0,0,.75);
  pointer-events:none;
}

.foot-note{white-space:nowrap}
.foot-visits{display:inline-flex;align-items:center;opacity:.9}
.foot-visits img{display:block;height:20px;width:auto;border-radius:4px}

/* ==================== 详情面板 ==================== */
.panel{
  position:fixed;inset:0;z-index:90;display:flex;justify-content:center;
  background:rgba(10,15,11,.52);
  backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);
  opacity:0;pointer-events:none;
  transition:opacity var(--dur-move) var(--ease);
}
.panel.is-open{opacity:1;pointer-events:auto}
.panel-inner{
  width:100%;max-width:1120px;height:100%;overflow-y:auto;overflow-x:hidden;
  padding:var(--s-600) clamp(20px,4vw,48px) var(--s-800);
  transform:translateY(20px) scale(.92);transform-origin:50% 34%;
  opacity:0;
  transition:transform 640ms cubic-bezier(.16,1,.3,1),opacity 420ms var(--ease);
  scrollbar-width:none;
}
.panel-inner::-webkit-scrollbar{width:0;height:0}
.panel.is-open .panel-inner{transform:none;opacity:1}

/* 液态玻璃阅读进度条（替代原生滚动条） */
.readbar{
  position:fixed;top:76px;height:calc(100dvh - 152px);width:10px;z-index:96;
  right:calc(max(6px, (100vw - 1120px) / 2 - 6px));
  border-radius:99px;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.08),inset -1px 0 0 rgba(255,255,255,.10),0 0 18px rgba(0,0,0,.22);
  backdrop-filter:blur(8px) saturate(160%);
  -webkit-backdrop-filter:blur(8px) saturate(160%);
  opacity:0;transition:opacity .45s var(--ease);
  touch-action:none;
}
.readbar.is-on{opacity:1;pointer-events:auto;cursor:grab}
.readbar.is-drag{cursor:grabbing}
.readbar.is-drag .readbar-fill{transition:none}
.readbar-fill{
  position:absolute;left:0;right:0;top:0;height:40%;
  border-radius:99px;
  background:linear-gradient(180deg,rgba(255,255,255,.52) 0%,rgba(255,255,255,.22) 46%,rgba(205,217,107,.42) 100%);
  background-size:100% 190%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(255,255,255,.35),inset 1px 0 0 rgba(255,255,255,.5),inset -1px 0 0 rgba(255,255,255,.25),0 0 16px rgba(255,255,255,.18);
  transition:transform .18s linear,height .25s var(--ease);
  animation:barflow 4.5s ease-in-out infinite alternate;
  will-change:transform;
}
.readbar-fill::after{
  content:"";position:absolute;left:2px;right:2px;top:2px;height:34%;
  border-radius:99px;
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));
  pointer-events:none;
}
@keyframes barflow{from{background-position:0 0}to{background-position:0 100%}}

.panel-head{
  position:relative;
  display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s-200);
  padding:var(--s-75) 0 var(--s-300);
  margin-bottom:var(--s-400);
  border-bottom:1px solid var(--line);
}
.panel-idx{
  display:block;font-size:12px;line-height:16px;font-weight:500;
  letter-spacing:.22em;color:var(--ink-3);margin-bottom:var(--s-75);
  font-variant-numeric:tabular-nums;
}
.panel-title{
  font-size:36px;line-height:40px;font-weight:600;letter-spacing:-.02em;
  text-wrap:balance;
}
.panel-close{
  position:fixed;top:54px;right:18px;z-index:95;
  display:inline-flex;align-items:center;gap:var(--s-75);
  padding:8px 16px;border-radius:var(--r-full);
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 8px 24px rgba(0,0,0,.24),inset 0 1.5px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,255,255,.06);
  font-size:14px;line-height:20px;font-weight:600;
  cursor:pointer;
  transition:border-color var(--dur-color) var(--ease),
             color var(--dur-color) var(--ease),
             background var(--dur-color) var(--ease),
             transform var(--dur-move) var(--ease);
}
.panel-close:hover{border-color:var(--accent);color:var(--accent)}
.panel-close:active{transform:scale(.98)}
.panel-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel-body p{font-size:16px;line-height:24px;color:var(--ink-2);margin-bottom:var(--s-200);text-wrap:pretty}
.panel-body p strong{color:var(--ink);font-weight:600}
.panel-body p.lead{
  font-size:24px;line-height:32px;font-weight:600;color:var(--ink);
  margin-bottom:var(--s-300);text-wrap:balance;
}
.panel-body p.lead em{font-style:normal;color:var(--accent)}
.prose p{max-width:56em}
.prose p:first-child{font-size:17px;line-height:27px;color:var(--ink)}
.sub{
  display:flex;align-items:center;gap:var(--s-100);
  font-size:12px;line-height:16px;font-weight:500;letter-spacing:.16em;
  color:var(--ink-3);text-transform:uppercase;
  margin:var(--s-400) 0 var(--s-200);
}
.sub::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* 基本信息 */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-75)}
.fact{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-200);
  padding:var(--s-100) var(--s-200);
  border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface);
}
.fact dt{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.06em;color:var(--ink-3);white-space:nowrap}
.fact dd{font-size:14px;line-height:20px;font-weight:600;color:var(--ink);text-align:right}

/* 技能 */
.skills{display:flex;flex-wrap:wrap;gap:var(--s-75)}
.skill{
  display:inline-block;
  padding:9px 18px;border-radius:var(--r-full);
  border:1px solid rgba(255,255,255,.18);
  font-size:14px;line-height:20px;font-weight:500;
  color:var(--ink);background:var(--surface);
  box-shadow:inset 0 1.2px 0 rgba(255,255,255,.22);
  transition:color var(--dur-color) var(--ease),
             border-color var(--dur-color) var(--ease),
             background var(--dur-color) var(--ease),
             transform var(--dur-move) var(--ease);
}
.skill:hover{color:var(--accent);border-color:rgba(205,217,107,.42);transform:translateY(-1px)}

/* 时间线 */
.tl{display:grid}
.tl-item{
  display:grid;grid-template-columns:168px minmax(0,1fr);gap:var(--s-400);
  padding:var(--s-300) 0;border-top:1px solid var(--line);
}
.tl-item:last-child{border-bottom:1px solid var(--line)}
.tl-period{display:block;font-size:14px;line-height:20px;font-weight:600;color:var(--accent);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tl-tag{display:block;font-size:12px;line-height:16px;font-weight:400;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-top:var(--s-50)}
.tl-body h3{font-size:18px;line-height:28px;font-weight:600;letter-spacing:-.01em;margin-bottom:var(--s-50)}
.tl-role{font-size:14px;line-height:20px;color:var(--ink-3);margin-bottom:var(--s-100)}
.tl-list{display:grid;gap:var(--s-75)}
.tl-list li{list-style:none;display:flex;gap:var(--s-100);font-size:14px;line-height:20px;color:var(--ink-2);text-wrap:pretty}
.tl-list li::before{content:"";flex:0 0 auto;width:4px;height:4px;margin-top:8px;border-radius:var(--r-full);background:rgba(205,217,107,.55)}
.tl-result{margin-top:var(--s-200);padding-left:var(--s-200);border-left:2px solid rgba(205,217,107,.4);font-size:14px;line-height:20px;color:var(--ink);text-wrap:pretty}

/* 主项目 */
.feat{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;margin-bottom:var(--s-200)}
.feat img{width:100%;height:clamp(240px,38vh,400px);object-fit:cover;object-position:top;display:block;background:var(--bg)}
.feat-body{padding:var(--s-300) var(--s-300) var(--s-400)}
.proj-meta{display:flex;flex-wrap:wrap;gap:var(--s-75);margin-bottom:var(--s-200)}
.chip{
  padding:4px 12px;border-radius:var(--r-full);
  font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;
  border:1px solid rgba(205,217,107,.28);color:var(--accent);
}
.chip.mute{border-color:var(--line);color:var(--ink-3)}
.feat-body h3{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.02em;margin-bottom:var(--s-100)}
.feat-body p{font-size:14px;line-height:20px;color:var(--ink-2);margin-bottom:var(--s-200);text-wrap:pretty}
.feat-body ul{display:grid;gap:var(--s-75)}
.feat-body li{list-style:none;display:flex;gap:var(--s-100);font-size:14px;line-height:20px;color:var(--ink-2);text-wrap:pretty}
.feat-body li::before{content:"";flex:0 0 auto;width:4px;height:4px;margin-top:8px;border-radius:var(--r-full);background:rgba(205,217,107,.55)}
.feat-link{
  display:inline-flex;align-items:center;gap:var(--s-75);margin-top:var(--s-300);
  font-size:14px;line-height:20px;font-weight:600;color:var(--accent);
  text-decoration:none;border-bottom:1px solid rgba(205,217,107,.35);padding-bottom:2px;
  transition:gap var(--dur-color) var(--ease),border-color var(--dur-color) var(--ease);
}
.feat-link:hover{gap:12px;border-color:var(--accent)}
.feat-link:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* 项目卡片：两列错落，不做等高三列 */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-200);align-items:start}
.card{
  position:relative;
  padding:var(--s-300);
  border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);
  display:flex;flex-direction:column;
  transition:transform var(--dur-move) var(--ease),border-color var(--dur-color) var(--ease);
}
.card:nth-child(2){margin-top:var(--s-400)}
.card:nth-child(3){margin-top:0}
.card:hover{transform:translateY(-4px);border-color:rgba(205,217,107,.3)}
.card .num{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.16em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.card h3{font-size:18px;line-height:28px;font-weight:600;margin:var(--s-100) 0 var(--s-50);letter-spacing:-.01em;text-wrap:balance}
.card .when{font-size:12px;line-height:16px;letter-spacing:.06em;color:var(--ink-3);margin-bottom:var(--s-25)}
.card .role{font-size:12px;line-height:16px;letter-spacing:.06em;color:rgba(205,217,107,.78);margin-bottom:var(--s-200)}
.card p{font-size:14px;line-height:20px;color:var(--ink-2);text-wrap:pretty}
.card.is-clickable{cursor:pointer}
.card-go{position:absolute;top:var(--s-300);right:var(--s-300);font-style:normal;font-size:14px;line-height:1;color:var(--ink-3);transition:color var(--dur-color) var(--ease),transform var(--dur-color) var(--ease)}
.card.is-clickable:hover .card-go{color:var(--accent);transform:translateX(2px)}
.card-tags{display:flex;flex-wrap:wrap;gap:var(--s-50);margin-top:auto;padding-top:var(--s-200)}

/* 分支导语 */
.branch-lead{
  max-width:52em;margin-bottom:var(--s-400);
  padding:2px 0 2px var(--s-200);
  border-left:2px solid rgba(205,217,107,.4);
  font-size:15px;line-height:25px;color:var(--ink-2);text-wrap:pretty;
}

/* 一对多：分支内的条目列表（带时间轴） */
.cases{position:relative;display:grid;gap:var(--s-200);padding-left:24px}
.cases::before{
  content:"";position:absolute;left:6px;top:10px;bottom:10px;width:1px;
  background:linear-gradient(180deg,rgba(205,217,107,.34),rgba(205,217,107,.04));
}
.case{
  position:relative;display:grid;grid-template-columns:136px minmax(0,1fr);gap:var(--s-300);
  padding:var(--s-250,18px) var(--s-300) var(--s-250,18px) var(--s-200);border-radius:var(--r-lg);
  border:1px solid rgba(255,255,255,.16);
  background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(255,255,255,.03) 50%,rgba(255,255,255,.06));
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 8px 26px rgba(0,0,0,.18),inset 0 1.5px 0 rgba(255,255,255,.22);
  cursor:pointer;
  transition:transform var(--dur-move) var(--ease),border-color var(--dur-color) var(--ease);
}
.case::before{
  content:"";position:absolute;left:-22px;top:28px;width:7px;height:7px;border-radius:50%;
  background:rgba(205,217,107,.72);box-shadow:0 0 10px rgba(205,217,107,.32);
}
.case:hover{transform:translateY(-3px);border-color:rgba(205,217,107,.32)}
.case:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.case-thumb{display:flex;align-items:center;justify-content:center;height:112px;border-radius:var(--r-md);overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.case-thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.case-thumb .case-num{font-size:24px;line-height:1;font-weight:600;color:var(--ink-3);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.case-main{min-width:0}
.case-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s-100);margin-bottom:var(--s-50)}
.case-period{font-size:12px;line-height:16px;letter-spacing:.06em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.case-role{font-size:12px;line-height:16px;letter-spacing:.06em;color:rgba(205,217,107,.78)}
.case h3{font-size:19px;line-height:28px;font-weight:600;letter-spacing:-.01em;margin-bottom:var(--s-50);text-wrap:balance}
.case-org{font-size:12px;line-height:16px;color:var(--ink-3);margin-bottom:var(--s-100)}
.case-sum{font-size:14px;line-height:22px;color:var(--ink-2);text-wrap:pretty}
.case-tags{display:flex;flex-wrap:wrap;gap:var(--s-50);margin-top:var(--s-200)}
.case-go{position:absolute;top:var(--s-200);right:var(--s-200);font-style:normal;font-size:14px;line-height:1;color:var(--ink-3);transition:color var(--dur-color) var(--ease),transform var(--dur-color) var(--ease)}
.case:hover .case-go{color:var(--accent);transform:translateX(2px)}
.tag{
  padding:4px 12px;border-radius:var(--r-full);
  font-size:12px;line-height:16px;color:var(--ink-3);
  border:1px solid var(--line);
}

/* 兴趣爱好：双列不等高 */
.hobbies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-100);align-items:start}
.hobby{
  position:relative;overflow:hidden;
  padding:var(--s-300);
  border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);
}
.hobby:nth-child(2){margin-top:var(--s-300)}
.hobby:nth-child(3){margin-top:calc(var(--s-300) * -1)}
.hobby .glyph{display:block;font-size:24px;line-height:32px;margin-bottom:var(--s-100)}
.hobby h3{font-size:18px;line-height:28px;font-weight:600;margin-bottom:var(--s-75)}
.hobby p{font-size:14px;line-height:20px;color:var(--ink-2);text-wrap:pretty}
.hobby .corner{position:absolute;right:-24px;bottom:-24px;width:80px;height:80px;border-radius:var(--r-full);background:radial-gradient(circle,rgba(205,217,107,.16),rgba(205,217,107,0) 70%)}

/* 其他方向 */
.more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-200)}
.panel-card{
  padding:var(--s-300);
  border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);
}
.panel-card h3{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase;margin-bottom:var(--s-200)}
.panel-card .links{display:grid;gap:var(--s-75)}
.panel-card a{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s-100);
  padding:var(--s-100) var(--s-200);border-radius:var(--r-md);
  border:1px solid var(--line-2);
  font-size:14px;line-height:20px;color:var(--ink);text-decoration:none;
  transition:border-color var(--dur-color) var(--ease),color var(--dur-color) var(--ease),padding var(--dur-move) var(--ease);
}
.panel-card a:hover{border-color:rgba(205,217,107,.45);color:var(--accent);padding-left:20px}
.panel-card a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel-card a .arrow{font-size:12px;color:var(--ink-3)}
.dirs{display:grid;gap:var(--s-100)}
.dir strong{display:block;font-size:16px;line-height:24px;font-weight:600}
.dir small{font-size:14px;line-height:20px;color:var(--ink-3)}
.panel-card .note{font-size:14px;line-height:20px;color:var(--ink-2);text-wrap:pretty}

/* 面板内所有内容框架：iOS 液态玻璃 */
.fact,.skill,.feat,.card,.hobby,.panel-card{
  background:linear-gradient(150deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.032) 50%,rgba(255,255,255,.062) 100%);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 8px 26px rgba(0,0,0,.20),inset 0 1.5px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,255,255,.06);
}

/* 技术能力 */
.abilities{display:grid;gap:var(--s-100)}
.ability{
  position:relative;
  padding:var(--s-300) var(--s-300) var(--s-300) calc(var(--s-300) + 34px);
  border-radius:var(--r-lg);
  border:1px solid rgba(255,255,255,.16);
  background:linear-gradient(150deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 50%,rgba(255,255,255,.06) 100%);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 8px 26px rgba(0,0,0,.18),inset 0 1.5px 0 rgba(255,255,255,.22);
}
.ability-no{
  position:absolute;left:var(--s-300);top:calc(var(--s-300) + 2px);
  font-size:11px;line-height:16px;font-weight:500;letter-spacing:.14em;
  color:rgba(205,217,107,.62);font-variant-numeric:tabular-nums;
}
.ability h3{font-size:16px;line-height:24px;font-weight:600;letter-spacing:.02em;margin-bottom:var(--s-50);color:var(--ink)}
.ability p{font-size:14px;line-height:22px;color:var(--ink-2);text-wrap:pretty}

/* 个人理念 */
.belief p{font-size:16px;line-height:24px;color:var(--ink-2);margin-bottom:var(--s-200);text-wrap:pretty}
.quote{
  margin-top:var(--s-500);padding:var(--s-500) var(--s-300);
  border-radius:var(--r-lg);border:1px solid rgba(205,217,107,.30);
  background:rgba(205,217,107,.07);
  font-size:28px;line-height:40px;font-weight:600;color:var(--ink);
  letter-spacing:.08em;text-wrap:balance;text-align:center;
}

/* 未来方向 */
.future{display:grid;gap:var(--s-100)}
.future-item{
  position:relative;
  padding:var(--s-200) var(--s-300) var(--s-200) calc(var(--s-300) + 24px);
  border-radius:var(--r-lg);
  border:1px solid rgba(255,255,255,.16);
  background:linear-gradient(150deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 50%,rgba(255,255,255,.06) 100%);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 8px 26px rgba(0,0,0,.16),inset 0 1.5px 0 rgba(255,255,255,.2);
}
.future-item::before{
  content:"";position:absolute;left:calc(var(--s-300) + 8px);top:var(--s-200);bottom:var(--s-200);
  width:1px;background:linear-gradient(180deg,rgba(205,217,107,.55),rgba(205,217,107,.06));
}
.future-item::after{
  content:"";position:absolute;left:calc(var(--s-300) + 5px);top:calc(var(--s-200) + 4px);
  width:7px;height:7px;border-radius:50%;background:rgba(205,217,107,.78);
  box-shadow:0 0 10px rgba(205,217,107,.35);
}
.future-item h3{font-size:13px;line-height:20px;font-weight:600;letter-spacing:.1em;color:var(--accent);margin-bottom:var(--s-50)}
.future-item p{font-size:15px;line-height:24px;color:var(--ink-2);text-wrap:pretty}

/* 可点开的条目 */
.fact.has-detail,.skill.has-detail{cursor:pointer}
.fact.has-detail:hover{border-color:rgba(205,217,107,.45)}
.fact.has-detail:hover .fact-go{color:var(--accent);transform:translateX(2px)}
.fact-go{display:inline-block;margin-left:var(--s-75);font-style:normal;color:var(--ink-3);font-size:14px;transition:color var(--dur-color) var(--ease),transform var(--dur-color) var(--ease)}
.skill.has-detail:hover{border-color:rgba(205,217,107,.5);color:var(--accent)}

/* 详情弹层 */
.detail{
  position:fixed;inset:0;z-index:130;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(8,12,9,.38);
  backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);
  opacity:0;pointer-events:none;transition:opacity 300ms var(--ease);
}
.detail.is-open{opacity:1;pointer-events:auto}
.detail-card{
  position:relative;width:min(760px,100%);max-height:84vh;overflow-y:auto;
  padding:24px 30px 34px;border-radius:20px;
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(150deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.04) 50%,rgba(255,255,255,.075) 100%);
  backdrop-filter:blur(34px) saturate(170%) brightness(1.03);-webkit-backdrop-filter:blur(34px) saturate(170%) brightness(1.03);
  box-shadow:0 24px 64px rgba(0,0,0,.4),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.08);
  transform:translateY(14px) scale(.985);transition:transform 420ms var(--ease);
}
.detail.is-open .detail-card{transform:none}
.detail-kicker{display:block;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase;margin-bottom:var(--s-75)}
.detail-title{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.01em;margin-bottom:var(--s-100);padding-right:60px;text-wrap:balance}

<script>
/* ============================================================
   JS 模块地图（自上而下）
   1. DATA      内容内联兜底数据（site.json 拉取失败时使用）
   2. DETAILS   六个分支的详情正文
   3. NODES     分支节点文案、位置与连线锚点
   4. layout    节点排布与贝塞尔曲线绘制
   5. gaze      鼠标视线追踪 + 12 方向场景切换
   6. data      site.json 异步加载并覆盖内联数据
   7. panel     简介/案例面板开合、详情阅读进度
   8. giscus    留言板按需加载
   9. theme     明暗主题切换与本地持久化
   ============================================================ */
/* ============================================================
   数据层：改内容只改这里
   ============================================================ */
/* 站点数据：内联默认值；若 content/site.json 可读（CMS 生成），启动后覆盖 */
let DATA = {
  about: {
    highlight: '山止川行，<em>风禾尽起</em>。',
    lines: [
      '我叫孙志昊，2005 年 11 月生，河北承德人。现在在山东石油化工学院读物联网工程，2025 级，大二。来东营之前，我以为自己会不习惯：承德出门就是坡，这里的路平得能望到头。待了两个月，反倒觉得平地挺好，骑车能一直往前，不用总刹车。',
      '性格测试是 ENTJ。有人说我强势，我承认一半是急。事情卡在那儿，我会一直惦记；定好的进度没动，我就忍不住去催。这毛病让我把一些事推成了，也得罪过人。后来学着把话放缓，先听完对方卡在哪，再谈进度。',

  linesSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);

  NODES.forEach(n => {
    const left = n.side === 'L';
    const nx = (left ? margin + n.w / 2 : w - margin - n.w / 2) + (n.dx || 0);
    const ny = h * rows[n.row] + (n.dy || 0);

    n.el.style.left = nx + 'px';
    n.el.style.top = ny + 'px';
    n.el.style.setProperty('--rot', (n.rot || 0) + 'deg');
    n.el.style.setProperty('--dx', (cx - nx) + 'px');
    n.el.style.setProperty('--dy', (cy - ny) + 'px');
    n.el.classList.toggle('flip', left);

    const dotX = left ? nx + (n.w / 2 - 20) : nx - (n.w / 2 - 20);
    const dotY = ny;

    const dx = dotX - cx, dy = dotY - cy;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;

    const t = 1 / Math.sqrt((ux / hw) ** 2 + (uy / hh) ** 2);
    const x1 = cx + ux * t;
    const y1 = cy + uy * t;

    const off = Math.min(w, h) * 0.09;
    const bend = left ? -1 : 1;
    const mx = (x1 + dotX) / 2, my = (y1 + dotY) / 2;
    const qx = mx + bend * off * 0.5;
    const qy = my - off * 0.35;

    const d = `M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${qx.toFixed(1)} ${qy.toFixed(1)} ${dotX.toFixed(1)} ${dotY.toFixed(1)}`;

    paths += `<path class="l-glow" data-key="${n.key}" d="${d}"/>`;
    paths += `<path class="l-core" data-key="${n.key}" d="${d}"/>`;
    paths += `<path class="l-hi" data-key="${n.key}" d="${d}"/>`;
    paths += `<path class="l-join" data-key="${n.key}" d="${d}"/>`;
  });
  linesSvg.innerHTML = paths;
  // 记下每条线长度，供“连通”动画使用
  linesSvg.querySelectorAll('path.l-join').forEach(p => {
    const len = p.getTotalLength();
    p.style.setProperty('--len', len);
    p.style.strokeDasharray = len + ' ' + len;
    p.style.strokeDashoffset = len;
  });
}

layout();
window.addEventListener('resize', () => { layout(); if (currentKey) markLive(currentKey); });

/* 开场：六个分支从中心依次释放，连线随后浮现 */
(function playIntro() {
  if (window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  NODES.forEach(n => n.el.classList.add('is-away'));
  linesSvg.classList.add('is-away');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    NODES.forEach((n, i) => {
      n.el.style.transitionDelay = (60 + i * 78) + 'ms';
      n.el.classList.remove('is-away');
    });
    linesSvg.style.transitionDelay = '300ms';
    linesSvg.classList.remove('is-away');
    setTimeout(() => {
      NODES.forEach(n => { n.el.style.transitionDelay = ''; });
      linesSvg.style.transitionDelay = '';
    }, 1800);
  }));
})();

/* ============================================================
   视线追踪：连续位移 + 朝向切换（带滞回）
   ============================================================ */
(function gaze() {
  const scene = $('#scene');
  const imgs = $$('img', scene);
  const layer = {};
  imgs.forEach(img => { layer[img.dataset.dir] = img; });

  const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const MAX_X = 22, MAX_Y = 14;
  const LERP_POS = 0.3;

  // 12 个角度槽，正下与两个 60 度低头已移除（回正面或用 30 度图代替）
  // 上方三段（lt60 / up / rt60）统一用正面图，与正下方对称
  const DIRS12 = ['right', 'rb30', 'rb30', null, 'lb30', 'lb30',
                  'left', 'lt30', null, null, null, 'rt30'];
  const dirs = ['right', 'rb30', 'lb30', 'left', 'lt30', 'lt60', 'up', 'rt60', 'rt30'];
  let curDir = null;                 // 当前画面方向，null = 正面
  let curIdx = -1, targetIdx = -1;   // -1 = 正面
  let lastStep = 0;
  const STEP_MS = reduce ? 0 : 260;  // 每转一档(30°)的间隔，越大越慢
  let tX = 0, tY = 0, cX = 0, cY = 0;
  let headX = 0, headY = 0, headR = 0;

  const apply = () => {
    scene.style.transform =
      'translate3d(' + cX.toFixed(2) + 'px,' + cY.toFixed(2) + 'px,0) scale(1.05)';
  };

  // 只在头部圆形区域渐变，其余画面永远显示 front，因此背景和文字不会闪
  const setHeadMasks = () => {
    const w = window.innerWidth, h = window.innerHeight;
    const iw = 2048, ih = 1152;
    const scale = Math.max(w / iw, h / ih);
    const dw = iw * scale, dh = ih * scale;
    const ox = (w - dw) / 2;
    const oy = (h - dh) * 0.46;
    const cx = ox + 0.49 * dw;
    const cy = oy + 0.33 * dh;
    const rad = 0.105 * dw;
    headX = cx; headY = cy; headR = rad;
    // 12 张图已离线合成到同一背景，整图切换即可，不再用局部遮罩
    dirs.forEach(k => {
      layer[k].style.webkitMaskImage = 'none';
      layer[k].style.maskImage = 'none';
    });
  };
  setHeadMasks();
  window.addEventListener('resize', setHeadMasks);

  // 点开分支时头部转向该分支方向；关掉面板回到正面
  const NODE_DIR = {
    about:      [-0.82, -0.42],
    campus:     [ 0.82, -0.42],
    projects:   [-0.95,  0.05],
    internship: [ 0.95,  0.05],
    interests:  [-0.82,  0.42],
    more:       [ 0.82,  0.42]
  };
  window.__lookAtNode = key => {
    const v = NODE_DIR[key];
    if (!v) return;
    setDir(v[0], v[1]);
    tX = v[0] * MAX_X;
    tY = v[1] * MAX_Y;
  };
  window.__gazeRelease = () => {
    tX = 0; tY = 0;
    setDir(0, 0);
  };

  // 动态热气 / Y 灯位置跟随场景
  const fxSteam = document.getElementById('steam');
  const layoutFx = () => {
    const w = window.innerWidth, h = window.innerHeight;
    const s = Math.max(w / 2048, h / 1152);
    const dw = 2048 * s, dh = 1152 * s;
    const ox = (w - dw) / 2, oy = (h - dh) * 0.46;
    fxSteam.style.left = (ox + 0.27 * dw) + 'px';
    fxSteam.style.top = (oy + 0.66 * dh) + 'px';
    fxSteam.style.width = (0.085 * dw) + 'px';
    fxSteam.style.height = (0.17 * dh) + 'px';
  };
  layoutFx();
  window.addEventListener('resize', layoutFx);

  // 硬切方向（带滞回）：任一时刻头部只显示一张图，因此没有残影
  const pickIdx = (ux, uy) => {
    const ax = Math.abs(ux), ay = Math.abs(uy);
    const dead = targetIdx >= 0 ? 0.24 : 0.42;
    if (ax < dead && ay < dead) return -1;
    let angle = Math.atan2(uy, ux) * 180 / Math.PI;
    if (angle < 0) angle += 360;
    return Math.round(angle / 30) % 12;
  };

  const paint = key => {
    curDir = key;
    dirs.forEach(k => { layer[k].style.opacity = (k === key) ? 1 : 0; });
  };

  // 只更新目标方向，真正的转动交给 stepToward 逐档完成
  const setDir = (ux, uy) => {
    const i = pickIdx(ux, uy);
    targetIdx = (i >= 0 && DIRS12[i] === null) ? -1 : i;
    if (STEP_MS === 0) { curIdx = targetIdx; paint(curIdx < 0 ? null : DIRS12[curIdx]); }
  };

  // 一次只转一档，沿最短路径，跳过没有图的正下位；不叠化，所以没有虚影
  const stepToward = () => {
    if (curIdx === targetIdx) return;
    if (curIdx < 0 || targetIdx < 0 || STEP_MS === 0) {
      curIdx = targetIdx;
    } else {
      let diff = ((targetIdx - curIdx) % 12 + 12) % 12;
      if (diff > 6) diff -= 12;
      const step = diff > 0 ? 1 : -1;
      curIdx = ((curIdx + step) % 12 + 12) % 12;
    }
    paint(curIdx < 0 ? null : DIRS12[curIdx]);
  };

  const render = () => {
    cX += (tX - cX) * LERP_POS;
    cY += (tY - cY) * LERP_POS;
    apply();
  };

  // 独立计时器驱动转头，鼠标不动也会把剩下的角度转完
  setInterval(() => {
    if (curIdx === targetIdx || STEP_MS === 0) return;
    const now = performance.now();
    if (now - lastStep >= STEP_MS) { lastStep = now; stepToward(); }
  }, 40);

  (function loop() {
    render();
    requestAnimationFrame(loop);
  })();

  let lastMX = -9999, lastMY = -9999;
  window.addEventListener('mousemove', e => {
    if (reduce || currentKey) return;
    const mx = e.clientX, my = e.clientY;

    // 小于 18px 的微动不重算方向，降低敏感度
    if (Math.hypot(mx - lastMX, my - lastMY) < 18) return;
    lastMX = mx; lastMY = my;

    const w = window.innerWidth, h = window.innerHeight;
    const dx = mx - w / 2;
    const dy = my - h * 0.44;
    const dist = Math.hypot(dx, dy);

    if (dist < 24) {
      tX = 0; tY = 0;
      setDir(0, 0);
      return;
    }

    const ux = dx / dist, uy = dy / dist;
    tX = ux * MAX_X;
    tY = uy * MAX_Y;
    setDir(ux, uy);
  }, { passive: true });

  document.addEventListener('mouseleave', () => {
    tX = 0; tY = 0;
    setDir(0, 0);
  });

  scene.addEventListener('dblclick', e => {
    const w = window.innerWidth, h = window.innerHeight;
    const sx = w / 2 + (headX - w / 2) * 1.05 + cX;
    const sy = h / 2 + (headY - h / 2) * 1.05 + cY;
    const sr = headR * 1.05;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (dx * dx + dy * dy <= sr * sr) {
      const helloEl = $('#hello');
      helloEl.style.left = sx + 'px';
      helloEl.style.top = (sy - sr - 18) + 'px';
      helloEl.classList.add('is-open');
      clearTimeout(window.__helloTimer);
      window.__helloTimer = setTimeout(() => helloEl.classList.remove('is-open'), 2600);
    }
  });
})();

let currentKey = null;
let revealObserver = null;

function initReveal() {
  if (revealObserver) revealObserver.disconnect();
  if (window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;

  revealObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        revealObserver.unobserve(en.target);
      }
    });
  }, { root: panelInner, threshold: 0.06, rootMargin: '0px 0px -40px 0px' });

  const sel = '.branch-lead, .prose > p, .sub, .facts > .fact, .abilities > .ability, .skills > .skill, .belief > p, .quote, .future > .future-item, .cases > .case, .hobbies > .hobby, .more-grid > .panel-card, .tl > .tl-item, .feat, .panel-body > p';
  const seen = new Map();
  Array.from(panelBody.querySelectorAll(sel)).forEach(el => {
    if (el.classList.contains('reveal')) return;
    const parent = el.parentElement;
    const n = seen.get(parent) || 0;
    seen.set(parent, n + 1);
    el.classList.add('reveal');
    el.style.setProperty('--i', String(Math.min(n, 8)));
    revealObserver.observe(el);
  });
}

/* 液态玻璃阅读进度条 */
const readbar = $('#readbar');
const readbarFill = $('#readbarFill');
function syncReadbar() {
  const trackH = readbar.clientHeight;
  const view = panelInner.clientHeight;
  const total = panelInner.scrollHeight;
  if (!trackH || !view || total <= 0) return;
  const h = Math.max(26, Math.round(trackH * Math.min(1, view / total)));
  readbarFill.style.height = h + 'px';
  const max = total - view;
  const p = max > 0 ? Math.min(1, Math.max(0, panelInner.scrollTop / max)) : 0;
  readbarFill.style.transform = 'translateY(' + Math.round(p * (trackH - h)) + 'px)';
}
panelInner.addEventListener('scroll', syncReadbar, { passive: true });
window.addEventListener('resize', syncReadbar);
if (window.ResizeObserver) new ResizeObserver(syncReadbar).observe(panelBody);

/* 拖动进度条 = 拖动内容：按住玻璃棒上下拖，正文实时跟着滚 */
let barDrag = false, barGrab = 0;
function barScrub(clientY) {
  const trackH = readbar.clientHeight;
  const fillH = readbarFill.offsetHeight || 60;
  const maxTop = trackH - fillH;
  const y = clientY - readbar.getBoundingClientRect().top - barGrab;
  const p = maxTop > 0 ? Math.min(1, Math.max(0, y / maxTop)) : 0;
  const max = panelInner.scrollHeight - panelInner.clientHeight;
  panelInner.scrollTop = p * max;
  syncReadbar();
}
readbar.addEventListener('pointerdown', e => {
  const fr = readbarFill.getBoundingClientRect();
  barGrab = (e.clientY >= fr.top && e.clientY <= fr.bottom) ? (e.clientY - fr.top) : fr.height / 2;
  barDrag = true;
  readbar.classList.add('is-drag');
  try { if (readbar.setPointerCapture) readbar.setPointerCapture(e.pointerId); } catch (err) {}
  barScrub(e.clientY);
  e.preventDefault();
});
readbar.addEventListener('pointermove', e => { if (barDrag) { barScrub(e.clientY); e.preventDefault(); } });
const endBarDrag = () => { barDrag = false; readbar.classList.remove('is-drag'); };
readbar.addEventListener('pointerup', endBarDrag);
readbar.addEventListener('pointercancel', endBarDrag);
readbar.addEventListener('lostpointercapture', endBarDrag);

/* 打开的分支：整条线通电连通并忽闪 */
function markLive(key) {
  linesSvg.querySelectorAll('path.l-join').forEach(p => {
    p.classList.toggle('is-live', !!key && p.dataset.key === key);
  });
}

function openPanel(key) {
  const node = NODES.find(n => n.key === key);
  if (!node) return;
  currentKey = key;
  panelTitle.textContent = node.label;
  panelIdx.textContent = node.idx;
  panelBody.innerHTML = RENDER[key]();
  panel.classList.add('is-open');
  panelInner.scrollTop = 0;
  if (window.__lookAtNode) window.__lookAtNode(key);
  markLive(key);
  $$('.node').forEach(el => el.classList.toggle('is-active', el.dataset.key === key));
  document.body.style.overflow = 'hidden';
  initReveal();
  readbar.classList.add('is-on');
  requestAnimationFrame(() => requestAnimationFrame(syncReadbar));
  setTimeout(syncReadbar, 220);
}

function closePanel() {
  panel.classList.remove('is-open');
  readbar.classList.remove('is-on');
  markLive(null);
  $$('.node').forEach(el => el.classList.remove('is-active'));
  currentKey = null;
  document.body.style.overflow = '';
  if (window.__gazeRelease) window.__gazeRelease();
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
}

$('#panelClose').addEventListener('click', closePanel);
panel.addEventListener('click', e => { if (!e.target.closest('.panel-inner')) closePanel(); });

/* 详情弹层 */
const detailEl = $('#detail');
let carTimer = null;
function startCarousel() {
  clearInterval(carTimer); carTimer = null;
  const car = $('#detailCarousel');
  const slides = Array.from(car.querySelectorAll('.slide'));
  if (slides.length < 2) return;
  const dots = Array.from(car.querySelectorAll('.dot'));
  let i = 0;
  const show = n => {
    i = (n + slides.length) % slides.length;
    slides.forEach((s, k) => s.classList.toggle('is-on', k === i));
    dots.forEach((dt, k) => dt.classList.toggle('is-on', k === i));
  };
  const tick = () => { clearInterval(carTimer); carTimer = setInterval(() => show(i + 1), 4500); };
  dots.forEach((dt, k) => dt.addEventListener('click', e => { e.stopPropagation(); show(k); tick(); }));
  tick();
}

function openDetail(k) {
  let d = DETAILS[k];
  if (!d) {
    const c = DATA.cases.find(x => x.key === k);
    if (!c) return;
    d = { kicker: c.org, title: c.title, desc: c.summary, tags: c.tags, images: c.images, links: c.links, points: c.points, sections: c.sections, result: c.result };
  }
  const imgEl = $('#detailImg');
  if (d.img) { imgEl.src = d.img; imgEl.style.display = 'block'; }
  else { imgEl.removeAttribute('src'); imgEl.style.display = 'none'; }

  const car = $('#detailCarousel');
  const imgs = (d.images || []).filter(Boolean);
  if (imgs.length) {
    car.style.display = 'block';
    car.innerHTML = imgs.map((s, i) => `<img class="slide${i === 0 ? ' is-on' : ''}" src="${s}" alt="${d.title || ''} 图 ${i + 1}" loading="lazy">`).join('')
      + (imgs.length > 1 ? `<div class="dots">${imgs.map((_, i) => `<button class="dot${i === 0 ? ' is-on' : ''}" type="button" data-slide="${i}"></button>`).join('')}</div>` : '');
  } else { car.style.display = 'none'; car.innerHTML = ''; }

  const tagsEl = $('#detailTags');
  const tags = d.tags || [];
  tagsEl.innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join('');
  tagsEl.style.display = tags.length ? 'flex' : 'none';

  const secEl = $('#detailSections');
  const secs = d.sections || [];
  secEl.innerHTML = secs.map(s => `<div class="ds${s.todo ? ' is-todo' : ''}"><h4>${s.h}</h4>${(s.p || '').split('\n').filter(t => t.trim()).map(t => `<p>${t}</p>`).join('')}</div>`).join('');
  secEl.style.display = secs.length ? 'grid' : 'none';

  const resEl = $('#detailResult');
  resEl.textContent = d.result || '';
  resEl.style.display = d.result ? 'block' : 'none';

  const linkEl = $('#detailLink');
  const lk = (d.links && d.links[0]) || d.link;
  if (lk) { linkEl.href = lk.url; linkEl.textContent = lk.text + ' ↗'; linkEl.style.display = 'inline-flex'; }
  else { linkEl.style.display = 'none'; linkEl.removeAttribute('href'); }

  $('#detailKicker').textContent = d.kicker || '';
  $('#detailTitle').textContent = d.title || '';
  $('#detailDesc').textContent = d.desc || '';
  const ptsEl = $('#detailPoints');
  const pts = d.points || [];
  ptsEl.innerHTML = pts.map(p => `<li>${p}</li>`).join('');
  ptsEl.style.display = pts.length ? 'grid' : 'none';
  detailEl.classList.add('is-open');
  startCarousel();
}
function closeDetail() { detailEl.classList.remove('is-open'); clearInterval(carTimer); carTimer = null; }
$('#detailClose').addEventListener('click', closeDetail);
detailEl.addEventListener('click', e => { if (!e.target.closest('.detail-card')) closeDetail(); });
detailEl.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', e => {
  const t = e.target.closest('[data-detail]');
  if (t) openDetail(t.dataset.detail);
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const tk = document.getElementById('talk');
  if (tk && tk.classList.contains('is-open')) { closeTalk(); return; }
  if (detailEl.classList.contains('is-open')) { closeDetail(); return; }
  if (currentKey) closePanel();
});

const hello = $('#hello');
function closeHello() { hello.classList.remove('is-open'); }
hello.addEventListener('click', () => closeHello());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHello(); });

/* 留言板（giscus，按需加载） */
const talkEl = document.getElementById('talk');
const talkFab = document.getElementById('talkFab');
const talkCloseBtn = document.getElementById('talkClose');
const giscusMount = document.getElementById('giscusMount');
let giscusLoaded = false;

function loadGiscus() {
  if (giscusLoaded || !giscusMount) return;
  giscusLoaded = true;
  const s = document.createElement('script');
  s.src = 'https://giscus.app/client.js';
  s.async = true;
  s.crossOrigin = 'anonymous';
  const attrs = {
    'data-repo': 'Sun-1025/Sun-1025.github.io',
    'data-repo-id': 'R_kgDOV1etUw',
    'data-category': 'Announcements',
    'data-category-id': 'DIC_kwDOV1etU84DLtON',
    'data-mapping': 'pathname',
    'data-strict': '0',
    'data-reactions-enabled': '1',
    'data-emit-metadata': '0',
    'data-input-position': 'bottom',
    'data-theme': 'transparent_dark',
    'data-lang': 'zh-CN'
  };
  Object.keys(attrs).forEach(k => s.setAttribute(k, attrs[k]));
  giscusMount.appendChild(s);
}

function openTalk() {
  if (!talkEl) return;
  talkEl.classList.add('is-open');
  talkEl.setAttribute('aria-hidden', 'false');
  if (talkFab) talkFab.setAttribute('aria-expanded', 'true');
  loadGiscus();
}

function closeTalk() {
  if (!talkEl) return;
  talkEl.classList.remove('is-open');
  talkEl.setAttribute('aria-hidden', 'true');
  if (talkFab) { talkFab.setAttribute('aria-expanded', 'false'); try { talkFab.focus(); } catch (err) {} }
}

if (talkFab) talkFab.addEventListener('click', e => {
  e.stopPropagation();
  if (talkEl.classList.contains('is-open')) closeTalk(); else openTalk();
});
if (talkCloseBtn) talkCloseBtn.addEventListener('click', e => { e.stopPropagation(); closeTalk(); });
document.addEventListener('click', e => {
  if (!talkEl || !talkEl.classList.contains('is-open')) return;
  if (e.target.closest('#talk') || e.target.closest('#talkFab')) return;
  closeTalk();
});
/* 明暗主题切换：默认深色，手动切换后写入 localStorage */
(function initTheme(){
  var root = document.documentElement;
  var btn = document.getElementById('themeToggle');
  try {
    var saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  } catch (err) {}
  if (!btn) return;
  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (err) {}
  });
})();
