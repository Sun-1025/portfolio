# Decap CMS 配置 · 孙志昊个人作品集
# 后台地址：https://sunzhihaoai.top/admin/
# 内容文件：site.json（首页启动时异步读取，读取失败则用 index.html 内联默认值）

backend:
  name: github
  repo: Sun-1025/Sun-1025.github.io
  branch: main
  # 免费 OAuth proxy（Netlify Functions 自建，源码见仓库 oauth-proxy/）
  base_url: https://sunzhihao-cms-auth.netlify.app
  auth_endpoint: auth
  cms_label_prefix: cms/

site_url: https://sunzhihaoai.top
display_url: https://sunzhihaoai.top
locale: zh_Hans

media_folder: "assets/uploads"
public_folder: "assets/uploads"

publish_mode: simple

collections:
  - name: site
    label: 站点内容
    description: 首页的简介、案例卡片、联系方式
    files:
      - name: data
        label: 全站数据
        file: site.json
        format: json
        fields:
          - name: about
            label: 个人简介
            widget: object
            fields:
              - name: highlight
                label: 首句高亮（可含 <em> 标签）
                widget: string
              - name: lines
                label: 简介段落
                widget: list
                field:
                  name: text
                  label: 段落
                  widget: text
              - name: facts
                label: 基本信息
                widget: list
                fields:
                  - { name: k, label: 名称, widget: string }
                  - { name: v, label: 内容, widget: string }
                  - { name: d, label: 详情键（可留空）, widget: string, required: false }
              - name: abilities
                label: 技术能力
                widget: list
                fields:
                  - { name: t, label: 标题, widget: string }
                  - { name: d, label: 正文, widget: text }
              - name: skills
                label: 技能栈
                widget: list
                fields:
                  - { name: n, label: 名称, widget: string }
                  - { name: d, label: 键（可留空）, widget: string, required: false }
              - name: belief
                label: 个人理念
                widget: object
                fields:
                  - name: lines
                    label: 理念段落
                    widget: list
                    field:
                      name: text
                      label: 段落
                      widget: text
                  - { name: quote, label: 金句, widget: string }
              - name: future
                label: 未来方向
                widget: list
                fields:
                  - { name: t, label: 阶段, widget: string }
                  - { name: d, label: 说明, widget: text }
          - name: cases
            label: 案例卡片（六节点的详情）
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: key, label: 唯一键（如 case-lib，不要改）, widget: string }
              - name: cat
                label: 分类
                widget: select
                options:
                  - { label: 实习经历, value: internship }
                  - { label: 项目经历, value: project }
                  - { label: 校园经历, value: campus }
                  - { label: 兴趣爱好, value: hobby }
              - { name: num, label: 编号, widget: string }
              - { name: title, label: 标题, widget: string }
              - { name: org, label: 归属 / 单位, widget: string }
              - { name: period, label: 时间, widget: string }
              - { name: role, label: 角色, widget: string }
              - { name: summary, label: 一句摘要, widget: text }
              - name: tags
                label: 标签
                widget: list
                field: { name: tag, label: 标签, widget: string }
              - name: images
                label: 图片路径（可留空）
                widget: list
                required: false
                field: { name: path, label: 路径, widget: string }
              - name: links
                label: 外链
                widget: list
                required: false
                fields:
                  - { name: text, label: 文本, widget: string }
                  - { name: url, label: 地址, widget: string }
              - name: sections
                label: 详情正文小节
                widget: list
                required: false
                fields:
                  - { name: h, label: 小标题, widget: string }
                  - { name: p, label: 正文, widget: text }
              - { name: result, label: 结果句, widget: text, required: false }
          - name: contacts
            label: 联系方式
            widget: list
            fields:
              - { name: label, label: 类型, widget: string }
              - { name: value, label: 值, widget: string }
              - { name: url, label: 链接（可留空）, widget: string, required: false }
          - name: directions
            label: 未来方向（关于本站页）
            widget: list
            fields:
              - { name: t, label: 方向, widget: string }
              - { name: d, label: 说明, widget: text }
          - { name: note, label: 关于这个网站, widget: text }
