[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# Decap CMS expects <base_url>/auth and <base_url>/callback
[[redirects]]
  from = "/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/callback"
  to = "/.netlify/functions/callback"
  status = 200

# legacy /api/* aliases (keep working)
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/callback"
  to = "/.netlify/functions/callback"
  status = 200
