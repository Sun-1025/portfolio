name: Force Threads playback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-threads.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch threads.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/assets/js/threads.js')
          s = p.read_text()
          s = s.replace("  const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;\n", "")
          s = s.replace('  settings.paused = reduceMotion;\n', '  // Force playback on every device.\n  settings.paused = false;\n')
          s = s.replace('    const moving = !s.paused && !reduceMotion;\n', '    const moving = !s.paused;\n')
          p.write_text(s)
          print('patched: reduceMotion left =', s.count('reduceMotion'))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/threads.js
          git diff --cached --quiet || git commit -m "fix: force threads playback"
          git push
